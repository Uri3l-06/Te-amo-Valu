<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="40" y1="30" x2="470" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCF7F3"/>
      <stop offset="1" stop-color="#F6EFE9"/>
    </linearGradient>
    <linearGradient id="mono" x1="170" y1="120" x2="352" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D98A6D"/>
      <stop offset="1" stop-color="#CF7E62"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="-30" x2="0" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7C7B6"/>
      <stop offset="1" stop-color="#F0B39D"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EBC6AF"/>
      <stop offset="1" stop-color="#DFA98D"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#D6C8BF" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="24" y="24" width="464" height="464" rx="84" fill="url(#bg)"/>
  </g>

  <!-- Monogram -->
  <text x="110" y="340" fill="url(#mono)" font-size="220" font-family="Georgia, 'Times New Roman', serif" font-weight="700">V</text>
  <text x="250" y="420" fill="url(#mono)" font-size="220" font-family="Georgia, 'Times New Roman', serif" font-weight="700">J</text>

  <!-- Connecting flourish -->
  <path d="M219 375C228 308 267 256 330 252C305 260 274 294 267 349C261 395 279 419 313 433C255 432 214 417 219 375Z" fill="url(#mono)" opacity="0.88"/>
  <path d="M244 292C275 265 309 250 342 252" stroke="url(#mono)" stroke-width="10" stroke-linecap="round" opacity="0.94"/>

  <!-- Heart inside J -->
  <path d="M285 364C285 351 295 343 305 343C314 343 320 348 324 354C328 348 334 343 343 343C353 343 363 351 363 364C363 383 344 396 324 414C304 396 285 383 285 364Z" fill="#E6A898"/>

  <!-- Gerbera flower -->
  <g transform="translate(378 138)">
    <g opacity="0.98">
      <ellipse cx="0" cy="-40" rx="12" ry="34" fill="url(#petal)"/>
      <ellipse cx="0" cy="-40" rx="12" ry="34" fill="url(#petal)" transform="rotate(20)"/>
      <ellipse cx="0" cy="-40" rx="12" ry="34" fill="url(#petal)" transform="rotate(40)"/>
      <ellipse cx="0" cy="-40" rx="12" ry="34" fill="url(#petal)" transform="rotate(60)"/>
      <ellipse cx="0" cy="-40" rx="12" ry="34" fill="url(#petal)" transform="rotate(80)"/>
      <ellipse cx="0" cy="-40" rx="12" ry="34" fill="url(#petal)" transform="rotate(100)"/>
      <ellipse cx="0" cy="-40" rx="12" ry="34" fill="url(#petal)" transform="rotate(120)"/>
      <ellipse cx="0" cy="-40" rx="12" ry="34" fill="url(#petal)" transform="rotate(140)"/>
      <ellipse cx="0" cy="-40" rx="12" ry="34" fill="url(#petal)" transform="rotate(160)"/>
      <ellipse cx="0" cy="-40" rx="12" ry="34" fill="url(#petal)" transform="rotate(180)"/>
      <ellipse cx="0" cy="-40" rx="12" ry="34" fill="url(#petal)" transform="rotate(200)"/>
      <ellipse cx="0" cy="-40" rx="12" ry="34" fill="url(#petal)" transform="rotate(220)"/>
      <ellipse cx="0" cy="-40" rx="12" ry="34" fill="url(#petal)" transform="rotate(240)"/>
      <ellipse cx="0" cy="-40" rx="12" ry="34" fill="url(#petal)" transform="rotate(260)"/>
      <ellipse cx="0" cy="-40" rx="12" ry="34" fill="url(#petal)" transform="rotate(280)"/>
      <ellipse cx="0" cy="-40" rx="12" ry="34" fill="url(#petal)" transform="rotate(300)"/>
      <ellipse cx="0" cy="-40" rx="12" ry="34" fill="url(#petal)" transform="rotate(320)"/>
      <ellipse cx="0" cy="-40" rx="12" ry="34" fill="url(#petal)" transform="rotate(340)"/>
    </g>
    <circle cx="0" cy="0" r="20" fill="#DE9578"/>
    <circle cx="0" cy="0" r="9" fill="#B86C51"/>
  </g>

  <!-- Stem and leaves -->
  <path d="M414 176C447 204 455 245 447 305C441 348 419 379 394 395" stroke="#E2B498" stroke-width="6" stroke-linecap="round"/>
  <path d="M416 224C399 218 385 223 374 241C392 245 404 241 416 224Z" fill="url(#leaf)"/>
  <path d="M429 256C413 251 399 256 388 273C406 277 418 273 429 256Z" fill="url(#leaf)"/>
</svg>
